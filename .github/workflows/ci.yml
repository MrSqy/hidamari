name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      # GTK/VLC/pydbus/gi need system libraries that are not installed here,
      # so we only byte-compile the tree and run the pure-Python test suite.
      # Tests must not import GUI/VLC-dependent modules (see docs/PROGRESS_ANALYSIS.md).
      - name: Byte-compile all sources (py_compile)
        run: python -m compileall -q src

      - name: Lint (ruff)
        # Do not fail the build on style-only issues yet; surface them as warnings.
        # Tighten to `ruff check src` once the existing warnings are cleaned up.
        run: |
          ruff check src --output-format=github || true

      - name: Run tests (pytest)
        run: |
          if [ -d tests ]; then
            pytest -q tests
          else
            echo "No tests/ directory yet — skipping. Add pure-Python tests (VideoPlaylist, sandbox, config migration)."
          fi
